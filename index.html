<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LABZ RC</title>

  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg: #121212;
      --text: #1E88E5;
      --footer: #7A7A7A;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
    }

    .centered {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
    }

    .container {
      max-width: 700px;
      padding: 20px;
      margin-top: -100px;
    }

    img.logo {
      width: 500px;
      max-width: 80%;
      height: auto;
      margin-bottom: 24px;
    }

    h1.slogan {
      font-weight: 600;
      font-size: 1.8rem;
      line-height: 1.3;
      margin: 0;
      padding: 0 10px;
      letter-spacing: 0.05em;
    }

    @media (max-width: 480px) {
      h1.slogan { font-size: 1.4rem; }
    }

    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      color: var(--footer);
      pointer-events: none;
      user-select: none;
      background: var(--bg);
      z-index: 20;
      padding: 12px 0;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      pointer-events: auto;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .nav-link {
      display: inline-block;
      margin-top: 32px;
      font-family: 'Exo 2', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--text);
      padding: 10px 28px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-link:hover {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>

<body>
  <div class="centered">
    <div class="container">
      <img src="logo.png" alt="LABZ RC" class="logo">
      <h1 class="slogan">Lab-Built. Story-Driven.</h1>
      <a href="build-files/index.html" class="nav-link">Build Files →</a>
    </div>
  </div>
  <div class="footer">&copy; 2026 <a href="https://craz.com">Crabtree Labz</a> · <a href="https://craz.com/privacy.html">Privacy</a></div>
</body>
</html>
